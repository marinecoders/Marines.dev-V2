order: 3
heading: "Key Features"
heroButtonText: 'DOWNLOAD PLUGIN'
heroButtonLink: 'https://tak.gov/plugins/flight-mode'
bullets:
  - 'Nine Line Copy Tool enables quickly copying down a close air support nine line as it is read out.'
  - 'Bullseye allows specifying point as an offset from a predefined bullseye.'
  - 'MGRS Picker assists in quickly specifying a MGRS point, allowing a pilot to select the grid box from the map, then entering the 4, 6, 8, or 10 digits of the grid.'
